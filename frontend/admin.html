<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin — Booked Sessions</title>
<style>
  body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
  h2 { color: #2e7d32; }
  .card { margin: 20px auto; max-width: 1100px; background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 11px 14px; border-bottom: 1px solid #eee; text-align: left; }
  th { background: #4CAF50; color: white; }
  tr:hover td { background: #f9f9f9; }
  a { color: #1565C0; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
  .badge-academic  { background: #e3f2fd; color: #1565C0; }
  .badge-wellbeing { background: #e8f5e9; color: #2e7d32; }
  .badge-career    { background: #fff3e0; color: #e65100; }
  .empty { text-align: center; color: #999; padding: 40px; }
</style>
</head>
<body>
<div class="card">
  <h2>📋 All Booked Sessions</h2>
  <p style="color:#666;font-size:13px;">Total: <strong id="count">—</strong> sessions</p>
  <table>
    <thead>
      <tr>
        <th>#</th><th>Student ID</th><th>Name</th><th>Email</th>
        <th>Category</th><th>Date</th><th>Time</th>
        <th>Meeting ID</th><th>Zoom Link</th><th>Booked At</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<script>
async function load() {
  try {
    const res = await fetch("http://localhost:5000/api/bookings");
    const rows = await res.json();
    document.getElementById("count").textContent = rows.length;
    const tbody = document.getElementById("tbody");
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="10" class="empty">No bookings yet.</td></tr>';
      return;
    }
    rows.forEach((r, i) => {
      const cats = {Academic:"badge-academic",Wellbeing:"badge-wellbeing",Career:"badge-career"};
      const catClass = cats[r.category] || "";
      tbody.innerHTML += `<tr>
        <td>${i+1}</td>
        <td>${r.student_id||r.name||"—"}</td>
        <td>${r.name||"—"}</td>
        <td>${r.email||"—"}</td>
        <td><span class="badge ${catClass}">${r.category||"—"}</span></td>
        <td>${r.date||"—"}</td>
        <td>${r.time||"—"}</td>
        <td>${r.meetingId||"—"}</td>
        <td>${r.meetLink ? `<a href="${r.meetLink}" target="_blank">Join</a>` : "—"}</td>
        <td>${r.createdAt||"—"}</td>
      </tr>`;
    });
  } catch(e) {
    document.getElementById("tbody").innerHTML =
      '<tr><td colspan="10" class="empty">❌ Could not load. Is backend running?</td></tr>';
  }
}
load();
</script>
</body>
</html>
