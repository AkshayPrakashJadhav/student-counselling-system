<!DOCTYPE html>
<html>

<head>
    <title>Admin - Booked Appointments</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
        }
        .card {
            margin: 40px auto;
            width: 80%;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: center;
        }
        th {
            background: #4CAF50;
            color: white;
        }
        a {
            color: blue;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>All Booked Appointments</h2>

    <table id="table">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Date</th>
            <th>Time</th>
            <th>Email</th>
            <th>Meet</th>
        </tr>
    </table>
</div>

<script>
async function loadBookings() {
    try {
        const response = await fetch("http://localhost:5000/api/bookings");
        const data = await response.json();

        const table = document.getElementById("table");

        data.forEach((row, index) => {
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${row.studentName}</td>
                <td>${row.date}</td>
                <td>${row.time}</td>
                <td>${row.email}</td>
                <td><a href="${row.meetLink}" target="_blank">Start Zoom</a></td>
            `;

            table.appendChild(tr);
        });

    } catch (error) {
        console.error("Error loading bookings:", error);
    }
}

// 🔥 Load data when page opens
loadBookings();
</script>

</body>
</html>
