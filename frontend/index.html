<!DOCTYPE html>
<html>
<head>
  <title>Student Counselling</title>
</head>
<body>

  <h2>Book Counseling Session</h2>

  <input type="text" id="name" placeholder="Enter your name" />
  <input type="datetime-local" id="time" />

  <button onclick="bookSession()">Book Session</button>

  <p id="result"></p>

  <script>
    async function bookSession() {
      const name = document.getElementById("name").value;
      const time = document.getElementById("time").value;

      const response = await fetch("http://localhost:5000/api/book-session", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          studentName: name,
          time: time
        })
      });

      const data = await response.json();

      if (data.success) {
        document.getElementById("result").innerHTML =
          "✅ Meet Link: <a href='" + data.meetLink + "' target='_blank'>" + data.meetLink + "</a>";
      } else {
        document.getElementById("result").innerText = "❌ Failed";
      }
    }
  </script>

</body>
</html>
