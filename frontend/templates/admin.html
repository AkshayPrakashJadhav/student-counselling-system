<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/static/style.css">
    <title>Admin - Booked Appointments</title>
</head>

<body>

<div class="card">
    <h2>All Booked Appointments</h2>

    <table border="1" width="100%">
        <tr>
            <th>ID</th>
            <th>Category</th>
            <th>Date</th>
            <th>Time</th>
            <th>Email</th>
        </tr>

        {% for row in data %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
        </tr>
        {% endfor %}

    </table>
</div>

</body>
</html>
