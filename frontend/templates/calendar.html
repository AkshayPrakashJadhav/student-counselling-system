<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Appointment</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  .card { background: white; padding: 36px; border-radius: 16px; width: 440px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  h2 { text-align: center; color: #2e7d32; margin-bottom: 24px; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-weight: bold; margin-bottom: 6px; color: #444; font-size: 14px; }
  input[type="text"], input[type="email"], input[type="date"] {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 14px; box-sizing: border-box;
  }
  .time-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
  .time-btn {
    padding: 9px 4px; border: 1px solid #4CAF50;
    background: white; color: #4CAF50; border-radius: 6px;
    cursor: pointer; font-size: 13px; text-align: center; transition: all 0.2s;
  }
  .time-btn:hover:not(.booked) { background: #4CAF50; color: white; }
  .time-btn.selected { background: #4CAF50; color: white; font-weight: bold; }
  .time-btn.booked {
    background: #f5f5f5; color: #ccc; border-color: #eee;
    cursor: not-allowed; text-decoration: line-through;
  }
  #submit-btn { margin-top: 8px; }
  .error { color: #e53935; font-size: 13px; margin-top: 4px; display: none; }
</style>
</head>
<body>
<div class="card">
  <h2>📅 Book Counseling Session</h2>

  <div class="form-group">
    <label>Student ID</label>
    <input type="text" id="student-id" placeholder="e.g. 1RN23AD062" />
  </div>
  <div class="form-group">
    <label>Full Name</label>
    <input type="text" id="student-name" placeholder="Your full name" />
  </div>
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="student-email" placeholder="Your college email" />
  </div>
  <div class="form-group">
    <label>Category: <strong id="cat-label">{{ category }}</strong></label>
    <input type="hidden" id="category" value="{{ category }}" />
  </div>
  <div class="form-group">
    <label>Select Date</label>
    <input type="date" id="date" onchange="loadSlots()" />
  </div>
  <div class="form-group">
    <label>Select Time Slot</label>
    <div class="time-grid" id="time-grid">
      <span style="color:#999;font-size:13px;grid-column:span 4;">Please select a date first</span>
    </div>
    <p class="error" id="slot-error">Please select a time slot.</p>
  </div>

  <button id="submit-btn" onclick="submitBooking()">🎥 Book Zoom Session</button>
  <p id="msg" style="text-align:center;margin-top:12px;font-size:14px;"></p>
</div>

<script>
const TIME_SLOTS = [
  "09:00","09:30","10:00","10:30",
  "11:00","11:30","14:00","14:30",
  "15:00","15:30","16:00","16:30","17:00"
];

let selectedTime = '';
let bookedSlots  = [];

document.getElementById("date").min = new Date().toISOString().split("T")[0];

async function loadSlots() {
  const date = document.getElementById("date").value;
  if (!date) return;
  selectedTime = '';
  try {
    const res = await fetch("/api/available-slots");
    bookedSlots = await res.json();
  } catch(e) { bookedSlots = []; }

  const booked = bookedSlots.filter(s => s.date === date).map(s => s.time);
  const grid = document.getElementById("time-grid");
  grid.innerHTML = '';
  TIME_SLOTS.forEach(t => {
    const isBooked = booked.includes(t);
    const btn = document.createElement("button");
    btn.className = "time-btn" + (isBooked ? " booked" : "");
    btn.textContent = t;
    if (!isBooked) btn.onclick = () => selectSlot(t, btn);
    grid.appendChild(btn);
  });
}

function selectSlot(time, btn) {
  document.querySelectorAll(".time-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
  selectedTime = time;
  document.getElementById("slot-error").style.display = "none";
}

async function submitBooking() {
  const studentId    = document.getElementById("student-id").value.trim();
  const studentName  = document.getElementById("student-name").value.trim();
  const studentEmail = document.getElementById("student-email").value.trim();
  const category     = document.getElementById("category").value;
  const date         = document.getElementById("date").value;
  const msg          = document.getElementById("msg");

  if (!studentId || !studentName || !studentEmail || !date) {
    msg.style.color = "#e53935";
    msg.textContent = "Please fill in all fields."; return;
  }
  if (!/^1RN\d{2}[A-Z]{2}\d{3}$/.test(studentId)) {
    msg.style.color = "#e53935";
    msg.textContent = "Invalid Student ID format."; return;
  }
  if (!selectedTime) {
    document.getElementById("slot-error").style.display = "block"; return;
  }

  msg.style.color = "#555";
  msg.textContent = "⏳ Creating Zoom meeting...";

  try {
    const res = await fetch("/api/book-session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        student_id:    studentId,
        student_name:  studentName,
        student_email: studentEmail,
        category:      category,
        date:          date,
        time:          selectedTime,
      })
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem("booking", JSON.stringify({
        name: studentName, date: data.date, time: data.time,
        category: data.category, meetLink: data.meet_link,
        meetingId: data.meeting_id, password: data.password,
      }));
      window.location.href = "/confirmation";
    } else {
      msg.style.color = "#e53935";
      msg.textContent = "❌ " + (data.message || "Booking failed.");
    }
  } catch(e) {
    msg.style.color = "#e53935";
    msg.textContent = "❌ Server error. Try again.";
  }
}
</script>
</body>
</html>
