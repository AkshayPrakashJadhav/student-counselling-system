<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Appointment Confirmed</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  .card { background: white; padding: 40px; border-radius: 16px; width: 440px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .icon { font-size: 56px; margin-bottom: 12px; }
  h1 { color: #2e7d32; margin: 0 0 8px; }
  .subtitle { color: #666; margin-bottom: 24px; }
  .details-table { width: 100%; border-collapse: collapse; text-align: left; margin: 16px 0; }
  .details-table td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
  .details-table td:first-child { font-weight: bold; color: #555; width: 40%; }
  .zoom-btn {
    display: inline-block; margin: 20px 0 8px;
    background: #2196F3; color: white;
    padding: 14px 32px; border-radius: 10px;
    text-decoration: none; font-size: 16px;
    font-weight: bold; transition: background 0.2s;
  }
  .zoom-btn:hover { background: #1565C0; }
  .back-btn {
    display: inline-block; margin-top: 8px;
    background: #f5f5f5; color: #333;
    padding: 10px 24px; border-radius: 8px;
    text-decoration: none; font-size: 14px;
  }
  .email-note { color: #888; font-size: 13px; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <h1>Session Confirmed!</h1>
  <p class="subtitle">Your counseling session has been booked successfully.</p>

  <table class="details-table" id="details">
    <tr><td>👤 Name</td><td id="d-name">—</td></tr>
    <tr><td>📚 Category</td><td id="d-category">—</td></tr>
    <tr><td>📅 Date</td><td id="d-date">—</td></tr>
    <tr><td>⏰ Time</td><td id="d-time">—</td></tr>
    <tr><td>🆔 Meeting ID</td><td id="d-id">—</td></tr>
    <tr><td>🔑 Password</td><td id="d-pass">—</td></tr>
  </table>

  <a id="zoom-link" class="zoom-btn" href="#" target="_blank">🎥 Join Zoom Meeting</a>
  <br/>
  <p class="email-note">📧 A confirmation email has been sent to your inbox.</p>
  <br/>
  <a href="/" class="back-btn">← Back to Home</a>
</div>

<script>
window.onload = function () {
  const raw = localStorage.getItem("booking");
  if (!raw) {
    document.getElementById("details").innerHTML =
      "<tr><td colspan='2' style='color:#e53935;text-align:center;'>No booking found. Please book again.</td></tr>";
    return;
  }
  const b = JSON.parse(raw);
  document.getElementById("d-name").textContent     = b.name      || "—";
  document.getElementById("d-category").textContent = b.category  || "—";
  document.getElementById("d-date").textContent     = b.date      || "—";
  document.getElementById("d-time").textContent     = (b.time     || "—") + " (IST)";
  document.getElementById("d-id").textContent       = b.meetingId || "—";
  document.getElementById("d-pass").textContent     = b.password  || "—";
  const link = document.getElementById("zoom-link");
  if (b.meetLink) { link.href = b.meetLink; }
  else { link.textContent = "⚠️ No meeting link"; link.style.background = "#ccc"; }
};
</script>
</body>
</html>
